name: Capture portfolio screenshots

on:
  # Push (any branch, when capture files change): captures only projects that have no screenshots yet.
  # Manual "Run workflow": re-captures every project, or just the one entered in "only".
  push:
    branches: ['**']
    paths:
      - .github/workflows/capture-portfolio.yml
      - tools/capture/capture.mjs
      - tools/capture/derive.mjs
      - tools/capture/targets.json
  workflow_dispatch:
    inputs:
      only:
        description: "Capture one project only: its slug from tools/capture/targets.json (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: capture-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install capture tools
        working-directory: tools/capture
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2 sharp@0.33.5
          npx playwright install --with-deps chromium

      - name: Capture live demos
        working-directory: tools/capture
        env:
          ONLY: ${{ inputs.only }}
          CAPTURE_MODE: ${{ github.event_name == 'push' && 'missing' || 'all' }}
        run: node capture.mjs "$ONLY"

      - name: Derive optimised site images
        working-directory: tools/capture
        env:
          ONLY: ${{ inputs.only }}
          CAPTURE_MODE: ${{ github.event_name == 'push' && 'missing' || 'all' }}
        run: node derive.mjs "$ONLY"

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tools/capture/out assets/portfolio
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "chore: capture live demo screenshots [skip ci]"
            git pull --rebase
            git push
          fi
